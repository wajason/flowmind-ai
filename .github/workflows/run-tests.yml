name: tests

# ══════════════════════════════════════════════════════════════════════════
# 【設計目標：每次 commit 都跑，但不燒光免費額度】
#
# Private repository 每月 2,000 分鐘免費額度，而且**不是每種 runner 都一樣貴**：
#     ubuntu   × 1
#     windows  × 2
#     macOS    × 10
# 所以主要工作跑 ubuntu，Windows 只在必要時跑（見下）。
#
# 【為什麼只跑 --core-only】
#
# 完整測試需要 PostgreSQL + pgvector，而且部分測試需要**已經建好的知識庫**
# （83 份文件 / 7,619 chunks），那需要跑 Ollama 產生 embedding ——
# 在 CI 裡重建要數十分鐘，而且要下載 18GB 模型。
#
# 那不叫持續整合，那叫每次 commit 燒掉半小時額度。
#
# 所以 CI 守的是**純邏輯那一層**：統編檢核碼、引用驗證、信心分數、
# 交叉驗證規則、HPES 計分 —— 這些是「絕對不該出錯」的部分，
# 而且不需要任何外部依賴，數秒跑完。
#
# 需要資料庫的整合測試留給本地 `python tests/test_core.py`（無旗標即全跑），
# 這個分工寫在 tests/test_core.py 的 CORE_TESTS / INTEGRATION_TESTS。
#
# 【額度估算】
# ubuntu 每次約 1.5 分鐘 × 每天 10 次 commit × 30 天 ≒ 450 分鐘/月
# 加上 Windows 每週一次 × 2 倍 ≒ 24 分鐘/月　→ 遠低於 2,000
# ══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
    # 只改文件時不需要跑測試 —— 這是最容易省下的額度
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:        # 需要時可手動觸發完整版

# 同一個分支有新 push 時取消還在跑的舊 job，不重複計費
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: 核心邏輯（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 10        # 卡住的 job 不會一直燒額度
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          # 只裝核心測試真正 import 得到的套件。
          # requirements.txt 含 torch / sentence-transformers 等重套件，
          # 在 CI 裡裝它們既慢又完全沒有被測到。
          #
          # 已確認 sentence_transformers 是**函式內延遲載入**，
          # 不裝也不會在 import 階段爆掉（flowmind/embeddings.py:49）。
          pip install rapidfuzz opencc-python-reimplemented python-dotenv \
                      psycopg2-binary httpx

      - name: 回歸測試（核心，不需資料庫）
        run: python tests/test_core.py --core-only

      - name: 檢查文件數字與實際一致
        # 這一步只驗「不需要資料庫的事實」（測試項數）。
        # 知識庫規模那幾項會自動略過並印出提示。
        run: python scripts/check_docs_consistency.py --skip-db

  windows:
    name: 核心邏輯（Windows）
    # Windows runner 是 2 倍計費，所以**不是每次 push 都跑**：
    # 只在 main 分支與手動觸發時跑，確認跨平台沒有壞掉
    # （路徑分隔、檔案編碼是最常見的破口）。
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install rapidfuzz opencc-python-reimplemented python-dotenv psycopg2-binary httpx
      - name: 回歸測試（核心）
        run: python tests/test_core.py --core-only
